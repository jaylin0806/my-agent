<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的題庫</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hd">
    <h1 id="title">我的題庫</h1>
    <p id="subtitle"></p>
  </header>

  <div class="bar">
    <select id="bank" aria-label="選擇題庫" hidden></select>
    <div class="tabs" role="tablist">
      <button class="tab on" data-view="year" role="tab">分年</button>
      <button class="tab" data-view="topic" role="tab">分主題</button>
      <button class="tab" data-view="shuffle" role="tab">隨機</button>
    </div>
  </div>

  <div class="ctrl">
    <select id="fYear" aria-label="年度"><option value="">全部年度</option></select>
    <select id="fTopic" aria-label="主題"><option value="">全部主題</option></select>
    <select id="fStatus" aria-label="作答狀態">
      <option value="">全部題目</option>
      <option value="todo">未作答</option>
      <option value="wrong">錯題本</option>
      <option value="right">已答對</option>
    </select>
    <input id="fKw" type="search" placeholder="搜尋題幹或選項…" aria-label="關鍵字">
  </div>
  <div class="ctrl">
    <button class="btn" id="expandBtn">全部展開詳解</button>
    <button class="btn warn" id="resetBtn">重置進度</button>
  </div>

  <details class="sync" id="sync">
    <summary>📦 備份／換裝置繼續作答</summary>
    <p class="hint">作答紀錄只存在這台裝置的瀏覽器裡。換手機或電腦前，先在這裡備份，到新裝置再匯入。</p>
    <div class="sync-row">
      <b>方法一：轉移碼</b>（適合手機，可用 LINE 或 Email 傳給自己）
      <div class="ctrl">
        <button class="btn" id="copyCodeBtn">複製轉移碼</button>
      </div>
      <textarea id="codeBox" rows="3" placeholder="在新裝置把轉移碼貼在這裡，再按「匯入轉移碼」" aria-label="轉移碼"></textarea>
      <div class="ctrl">
        <button class="btn" id="importCodeBtn">匯入轉移碼</button>
      </div>
    </div>
    <div class="sync-row">
      <b>方法二：備份檔</b>（適合電腦，可存到雲端硬碟或隨身碟）
      <div class="ctrl">
        <button class="btn" id="downloadBtn">下載備份檔</button>
        <label class="btn" for="fileInput">選擇備份檔匯入</label>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </div>
    </div>
    <p class="hint">匯入時會和這台裝置現有的紀錄合併：同一題保留較新的作答，不會清掉原本的紀錄。</p>
    <p id="syncMsg" class="sync-msg" role="status" aria-live="polite"></p>
  </details>

  <div id="stats" class="stats"></div>
  <div id="count" class="count"></div>
  <main id="list"></main>
</div>
<script src="app.js"></script>
</body>
</html>
